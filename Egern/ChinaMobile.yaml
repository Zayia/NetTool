name: 中国移动组件服务
description: 抓取移动登录参数并查询话费与套餐，读取「Zayia 组件服务」BoxJS 变量，供 Scripting 小组件使用。
author: ChinaMobileDev, ByteValley, Zayia
scriptings:
  - http_request:
      name: 移动凭据抓取
      match: '^https:\/\/client\.app\.coc\.10086\.cn\/biz-orange\/[LD]N\/(?:uam(?:onekey|randcode)login|realPersonAuthentication)\/autoLogin(?:\?.*)?$'
      script_url: https://raw.githubusercontent.com/Zayia/NetTool/main/Scripts/ChinaMobile.js?v=1.3.1
      body_required: true
      max_size: 0
      timeout: 15
  - http_request:
      name: 移动组件查询
      match: '^https:\/\/api\.example\.com\/zayia\/10086\/query(?:\?.*)?$'
      script_url: https://raw.githubusercontent.com/Zayia/NetTool/main/Scripts/ChinaMobile.js?v=1.3.1
      body_required: true
      max_size: 0
      timeout: 60
mitm:
  hostnames:
    includes:
      - client.app.coc.10086.cn
      - api.example.com
