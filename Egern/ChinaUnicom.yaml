name: 中国联通
description: 从中国联通 App 抓取凭据并写入 BoxJS，供 Scripting 直接查询话费和套餐。
author: ByteValley, Zayia
scriptings:
  - http_request:
      name: 中国联通凭据抓取
      match: '^https:\/\/m\.client\.10010\.com\/navigationService\/naviService\/hotRecommend(?:\?.*)?$'
      script_url: https://raw.githubusercontent.com/Zayia/NetTool/main/Scripts/ChinaUnicom.js?v=1.0.7
      body_required: false
      timeout: 5
mitm:
  hostnames:
    includes:
      - m.client.10010.com
