#!name=中国移动组件服务
#!desc=抓取移动登录参数并查询话费与套餐，读取「Zayia 组件服务」BoxJS 变量，供 Scripting 小组件使用。
#!author=ChinaMobileDev, ByteValley, Zayia

# 在 Quantumult X 的重写资源中添加本文件。
# 手机号和静默模式在 BoxJS「Zayia 组件服务 → 中国移动」中设置。
hostname = client.app.coc.10086.cn, api.example.com
^https:\/\/client\.app\.coc\.10086\.cn\/biz-orange\/[LD]N\/(?:uam(?:onekey|randcode)login|realPersonAuthentication)\/autoLogin(?:\?.*)?$ url script-request-body https://raw.githubusercontent.com/Zayia/NetTool/main/Scripts/ChinaMobile.js?v=1.3.1
^https:\/\/api\.example\.com\/zayia\/10086\/query(?:\?.*)?$ url script-analyze-echo-response https://raw.githubusercontent.com/Zayia/NetTool/main/Scripts/ChinaMobile.js?v=1.3.1
